services:
  h3-console:
    build: .
    container_name: h3-production-console
    restart: unless-stopped
    ports:
      - "8926:8926"
    environment:
      PORT: "8926"
      HOST: "0.0.0.0"
      DATA_DIR: "/data"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请在.env中设置ADMIN_PASSWORD}"
      SESSION_SECRET: "${SESSION_SECRET:?请在.env中设置SESSION_SECRET}"
      MAX_UPLOAD_MB: "300"
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 1G
