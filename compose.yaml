services:
  h3-console:
    build: .
    container_name: h3-production-console
    restart: unless-stopped
    ports:
      - "8926:8926"
    environment:
      PORT: "8926"
      HOST: "0.0.0.0"
      DATA_DIR: "/data"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请在.env中设置ADMIN_PASSWORD}"
      SESSION_SECRET: "${SESSION_SECRET:?请在.env中设置SESSION_SECRET}"
      MAX_UPLOAD_MB: "300"
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          memory: 1G
*** Add File: /workspace/scratch/c9ce92116ea6/h3-production-console/.env.example
ADMIN_PASSWORD=请设置一个新的网页登录密码
SESSION_SECRET=请填写至少32位随机字符串
