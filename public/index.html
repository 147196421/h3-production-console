<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>漫剧制作台</title>
  <link rel="stylesheet" href="/styles.css?v=1.16.4">
</head>
<body>
  <div id="login" class="login-layer hidden">
    <form id="loginForm" class="login-card">
      <div class="brand-mark">H3</div>
      <h1>漫剧制作台</h1>
      <p>输入管理密码继续</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="管理密码" required>
      <button class="primary" type="submit">登录</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>

  <header>
    <div>
      <span class="eyebrow">VIDEO PRODUCTION · V1.16.4</span>
      <h1>漫剧制作台</h1>
    </div>
    <nav class="main-nav" aria-label="后台区域">
      <button id="showProduction" class="nav-item active" type="button">制作台</button>
      <button id="openDocs" class="nav-item" type="button">项目文档</button>
      <button id="openSystem" class="nav-item" type="button">运行状态</button>
    </nav>
    <div class="header-actions">
      <label class="file-button">导入<input id="importFile" type="file" accept="application/json"></label>
      <button id="logout" class="ghost">退出</button>
    </div>
  </header>

  <main>
    <section class="project-bar">
      <div>
        <label for="projectSelect">项目</label>
        <select id="projectSelect"></select>
      </div>
      <div>
        <label for="episodeSelect">集数</label>
        <select id="episodeSelect"></select>
      </div>
      <div class="model-select-wrap">
        <label for="modelSelect">视频模型</label>
        <select id="modelSelect"><option value="h3">H3</option><option value="grok">Grok</option></select>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><span id="progressText">0 / 0</span><strong id="progressPct">0%</strong></div>
        <div class="progress"><i id="progressBar"></i></div>
      </div>
    </section>

    <div class="workspace">
      <aside class="task-list-panel">
        <div class="panel-title"><h2>镜头任务</h2><span id="taskCount"></span></div>
        <div id="taskList" class="task-list"></div>
      </aside>

      <section id="taskEditor" class="task-editor empty">
        <div class="empty-state">选择一个镜头开始制作</div>
      </section>

      <aside class="output-panel">
        <div class="panel-title"><h2>生成结果 <em id="modelBadge" class="model-badge">H3</em></h2><span id="uploadState">等待上传</span></div>
        <label id="dropZone" class="drop-zone">
          <input id="videoInput" type="file" accept="video/mp4,video/quicktime,video/webm,video/x-matroska">
          <span class="upload-icon">＋</span>
          <strong id="uploadLabel">上传H3视频</strong>
          <small>处理后仅保留首帧和尾帧</small>
        </label>
        <div id="uploadProgress" class="upload-progress hidden"><i></i><span>正在上传并挑选清晰画面…</span></div>
        <div id="frames" class="frames hidden">
          <figure><figcaption>推荐首帧 <span id="startTime"></span></figcaption><a id="startLink" target="_blank"><img id="startImage" alt="推荐首帧"></a></figure>
          <figure><figcaption>推荐尾帧 <span id="tailTime"></span></figcaption><a id="tailLink" target="_blank"><img id="tailImage" alt="推荐尾帧"></a></figure>
        </div>
        <div class="tip"><strong>衔接建议</strong><p id="nextHint">完成当前镜头后，这里会提示下一镜该使用哪张参考图。</p></div>
      </aside>
    </div>
  </main>
  <div id="docsModal" class="docs-layer hidden" role="dialog" aria-modal="true" aria-labelledby="docsTitle">
    <section class="docs-dialog">
      <div class="docs-head">
        <div><span class="eyebrow">PROJECT ARCHIVE</span><h2 id="docsTitle">项目文档</h2></div>
        <div class="docs-actions"><button id="copyDoc" class="ghost">复制全文</button><button id="closeDocs" class="ghost" aria-label="关闭项目文档">关闭</button></div>
      </div>
      <select id="docsSelect" class="docs-select" aria-label="选择项目文档"></select>
      <div class="docs-body">
        <nav id="docsList" class="docs-list" aria-label="文档目录"></nav>
        <article class="docs-reader"><h3 id="docHeading">选择一份文档</h3><div id="docContent" class="markdown-body">正在读取文档目录…</div></article>
      </div>
    </section>
  </div>
  <div id="systemModal" class="docs-layer hidden" role="dialog" aria-modal="true" aria-labelledby="systemTitle">
    <section class="system-dialog">
      <div class="docs-head">
        <div><span class="eyebrow">RUNTIME</span><h2 id="systemTitle">运行状态</h2></div>
        <button id="closeSystem" class="ghost" aria-label="关闭运行状态">关闭</button>
      </div>
      <div class="system-body">
        <div class="system-card"><span>当前运行版本</span><strong id="currentVersion">V1.16.4</strong></div>
        <div class="system-card"><span>视频处理组件</span><strong id="mediaStatus">检查中…</strong></div>
        <p class="system-note">这里仅显示当前服务的运行情况。项目设定、剧情大纲和AI交接资料请从“项目文档”进入。</p>
      </div>
    </section>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="/app.js?v=1.16.4"></script>
</body>
</html>
